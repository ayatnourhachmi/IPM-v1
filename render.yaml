services:
  - type: web
    name: ipm-api
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      # CORS_ORIGINS must list your exact Vercel URL if not using *.vercel.app (default regex in prod).
      - key: CORS_ORIGINS
        value: http://localhost:3000,https://your-app.vercel.app
      - key: LLM_PROVIDER
        value: groq
      - key: GROQ_API_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: local
      - key: PINECONE_API_KEY
        sync: false
      # Create the index manually in Pinecone (cosine, dim=384) or set AUTO_CREATE_INDEX true.
      - key: PINECONE_INDEX
        value: ipm-vectors
      - key: PINECONE_REGION
        value: us-east-1
      - key: PINECONE_CLOUD
        value: aws
      - key: PINECONE_INDEX_DIMENSION
        value: "384"
      - key: PINECONE_AUTO_CREATE_INDEX
        value: "false"
      - key: PINECONE_SEED_CATALOG_ON_STARTUP
        value: "true"
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: LANGFUSE_HOST
        value: https://cloud.langfuse.com
